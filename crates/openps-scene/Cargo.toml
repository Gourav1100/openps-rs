[package]
name = "openps-scene"
version.workspace = true
edition.workspace = true
description = "Scene detection for the key map: a small vision model reads the stream picture, a filter combines it with the player's actions"

[dependencies]
openps-input = { path = "../openps-input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-ml = "0.3"
objc2-vision = "0.3"
objc2-core-video = "0.3"

[dev-dependencies]
tempfile = "3"
