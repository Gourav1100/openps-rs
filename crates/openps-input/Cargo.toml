[package]
name = "openps-input"
version.workspace = true
edition.workspace = true
description = "Con2PC keyboard/mouse -> virtual PS5 pad mapping engine (spec 04). Replaces OpenPS's own keyboard/mouse logic."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
