[package]
name = "openps-psn"
version.workspace = true
edition.workspace = true
description = "PSN OAuth (authorization code flow) to obtain the account id and tokens. Network access is behind a trait; no live client is compiled by default."

[features]
# Enables `live::UreqClient`, a real HTTPS client. Off by default: the tests and CI never talk to Sony.
live = ["dep:ureq"]

[dependencies]
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[bin]]
name = "extract-psn-config"
path = "src/bin/extract-psn-config.rs"

[dev-dependencies]
tempfile = "3"
