[package]
name = "openps-remote"
version.workspace = true
edition.workspace = true
description = "PSN remote registration of a PS5 (spec analysis/spec/09 and 09b): session signaling, UDP hole punch, reliable-UDP register request"

[features]
# The real push WebSocket (TLS to Sony's servers). Off by default: tests and default builds never touch the network.
live = ["dep:tungstenite", "dep:rustls", "dep:webpki-roots"]

[dependencies]
tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
openps-crypto = { path = "../openps-crypto" }
openps-psn = { path = "../openps-psn" }
openps-rp = { path = "../openps-rp" }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
